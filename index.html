  const 自动解密 = true;
  const 预置密码 = "SGFzYW4xMjNAJQ==";
  
  let 解析后;
  try { 解析后 = JSON.parse(decodeURIComponent(atob(加密数据))); }
  catch(错) { document.body.innerHTML='<h2>数据损坏</h2>'; return; }
  
  const 迭代 = 解析后.iter;
  const 盐 = CryptoJS.enc.Base64.parse(解析后.salt);
  const 向量 = CryptoJS.enc.Base64.parse(解析后.iv);
  const 密文 = 解析后.ct;
  
  function 执行解密(密码输入) {
    try {
      const 密钥 = CryptoJS.PBKDF2(密码输入, 盐, { keySize: 256/32, iterations: 迭代, hasher: CryptoJS.algo.SHA256 });
      const 解密 = CryptoJS.AES.decrypt({ ciphertext: CryptoJS.enc.Base64.parse(密文) }, 密钥, { iv: 向量, mode: CryptoJS.mode.CBC, padding: CryptoJS.pad.Pkcs7 });
      const 明文 = 解密.toString(CryptoJS.enc.Utf8);
      if (!明文) throw new Error('解密失败');
      document.open(); document.write(明文); document.close();
      return true;
    } catch(e) {
      return false;
    }
  }
  
  if (自动解密 && 预置密码) {
    const 成功 = 执行解密(atob(预置密码));
